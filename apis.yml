aid: brigit
name: Brigit
description: Brigit is a consumer financial technology company whose mobile app helps people manage
  everyday money with instant cash advances of up to $500 with no credit check, interest, or late fees,
  a Credit Builder account, and a Finance Helper for budgeting, spending analysis, bill tracking, and
  overdraft prediction. The app also bundles identity-theft protection and a deals-and-offers marketplace,
  and is offered on paid monthly subscription tiers. Brigit reports more than 12 million users. This
  API Evangelist profile is a company lead surfaced from venture-capital portfolios (Canaan Partners,
  DCM Ventures, Lightspeed Venture Partners); Brigit is a direct-to-consumer app and does not currently
  publish a public developer API, so this record is enriched at the identity and web-property level.
